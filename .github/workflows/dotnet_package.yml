# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

# How you can use the upload-artifact action to upload test results
name: dotnet package

on:
  [push]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./MyConsoleApp
    strategy:
      matrix:
        dotnet-version: [ '8.0.x', '10.0.x' ]
    steps:
      - uses: actions/checkout@v6
      - name: Setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ matrix.dotnet-version }}
      - name: Install dependencies
        run: dotnet restore
      - name: Test with dotnet
        run: dotnet test --no-restore --logger trx --results-directory "TestResults-${{ matrix.dotnet-version }}"
      - name: Upload dotnet test results
        uses: actions/upload-artifact@v7
        with:
          name: dotnet-results-${{ matrix.dotnet-version }}
          path: TestResults-${{ matrix.dotnet-version }}
        # Use always() to always run this step to publish test results when there are test failures
        if: ${{ always() }}
      - name: Debug test execution
        run: |
          echo "=== Current Directory ==="
          pwd
          ls -la
    
          echo "=== Project Files ==="
          find . -name "*.csproj" -type f
          
          echo "=== Running Tests with Verbose Output ==="
          dotnet test --no-restore -v n
          
          echo "=== Checking Test Results Directory ==="
          ls -laR TestResults-8.0.x 2>&1 || echo "Directory does not exist"
          
          echo "=== Searching for Any TRX Files ==="
          find . -name "*.trx" -type f
